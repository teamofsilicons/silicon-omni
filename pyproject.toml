[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "silicon-omni"
version = "0.1.0"
description = "One Python interface for Claude Code, Codex and Antigravity — subscription-powered, session-portable."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Team of Silicons" }]
keywords = ["claude", "codex", "antigravity", "gemini", "agents", "cli"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Software Development :: Libraries",
]
dependencies = []

[project.urls]
Homepage = "https://omni.teamofsilicons.com"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-timeout>=2"]

[tool.hatch.build.targets.wheel]
packages = ["omni"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --timeout=120 -m 'not live'"
markers = ["live: drives a real provider CLI — needs auth, spends quota. Run with: pytest -m live"]
