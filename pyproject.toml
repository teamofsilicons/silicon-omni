[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "silicon-omni"
version = "0.7.0"
description = "One Python interface for Claude Code, Codex and Antigravity, backed by a persistent Rust daemon."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Team of Silicons" }]
keywords = ["claude", "codex", "antigravity", "gemini", "agents", "cli"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = []

[project.scripts]
silicon-omni = "omni.cli:main"
so = "omni.cli:short"
omni = "omni.cli:omni"

[project.urls]
Homepage = "https://omni.teamofsilicons.com"
Documentation = "https://omni.teamofsilicons.com/docs"
Repository = "https://github.com/teamofsilicons/silicon-omni"
Issues = "https://github.com/teamofsilicons/silicon-omni/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-timeout>=2"]

[tool.hatch.build.targets.wheel]
packages = ["omni"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
include = [
  "/Cargo.lock",
  "/Cargo.toml",
  "/CHANGELOG.md",
  "/LICENSE",
  "/README.md",
  "/benchmarks",
  "/crates",
  "/hatch_build.py",
  "/omni",
  "/tests/wheel_smoke.py",
]

[tool.cibuildwheel]
# The wheel contains Python-independent Rust executables. Build it once with
# the oldest supported CPython, while the Hatch hook publishes a py3-none tag.
# Linux intentionally selects manylinux only; musllinux is not built here.
build = "cp310-manylinux_* cp310-macosx_*"
test-sources = ["tests/wheel_smoke.py"]
test-command = "python tests/wheel_smoke.py"

[tool.cibuildwheel.linux]
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --timeout=120 -m 'not live'"
markers = ["live: drives a real provider CLI — needs auth, spends quota. Run with: pytest -m live"]
