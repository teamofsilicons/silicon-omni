[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "silicon-omni"
version = "0.3.0"
description = "One Python interface for Claude Code, Codex and Antigravity — subscription-powered, session-portable."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Team of Silicons" }]
keywords = ["claude", "codex", "antigravity", "gemini", "agents", "cli"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://omni.teamofsilicons.com"
Documentation = "https://omni.teamofsilicons.com/docs"
Repository = "https://github.com/teamofsilicons/silicon-omni"
Issues = "https://github.com/teamofsilicons/silicon-omni/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-timeout>=2"]

[tool.hatch.build.targets.wheel]
packages = ["omni"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --timeout=120 -m 'not live'"
markers = ["live: drives a real provider CLI — needs auth, spends quota. Run with: pytest -m live"]
