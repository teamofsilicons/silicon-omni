name: Web and registry
on:
  push:
    paths: ['apps/web/**', '.github/workflows/web.yml']
  pull_request:
    paths: ['apps/web/**', '.github/workflows/web.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run build
