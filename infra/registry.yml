AWSTemplateFormatVersion: '2010-09-09'
Description: Omni versioned model catalog and Vercel workload identity
Parameters:
  VercelTeam:
    Type: String
  VercelProject:
    Type: String
Resources:
  Catalog:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub omni-registry-${AWS::AccountId}-${AWS::Region}
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
  CatalogTransportPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref Catalog
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !GetAtt Catalog.Arn
              - !Sub ${Catalog.Arn}/*
            Condition:
              Bool:
                aws:SecureTransport: 'false'
  VercelIdentity:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: !Sub https://oidc.vercel.com/${VercelTeam}
      ClientIdList:
        - !Sub https://vercel.com/${VercelTeam}
  CatalogRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Only this Vercel production project may read or publish the Omni catalog
      AssumeRolePolicyDocument:
        Fn::Sub: |
          {
            "Version": "2012-10-17",
            "Statement": [{
              "Effect": "Allow",
              "Principal": {"Federated": "${VercelIdentity}"},
              "Action": "sts:AssumeRoleWithWebIdentity",
              "Condition": {"StringEquals": {
                "oidc.vercel.com/${VercelTeam}:aud": "https://vercel.com/${VercelTeam}",
                "oidc.vercel.com/${VercelTeam}:sub": "owner:${VercelTeam}:project:${VercelProject}:environment:production"
              }}
            }]
          }
      Policies:
        - PolicyName: CatalogDocument
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource: !Sub ${Catalog.Arn}/catalog.json
Outputs:
  Bucket:
    Value: !Ref Catalog
  RoleArn:
    Value: !GetAtt CatalogRole.Arn
