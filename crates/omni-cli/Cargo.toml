[package]
name = "silicon-omni-cli"
description = "Command-line client for the silicon omni daemon."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true

[[bin]]
name = "silicon-omni"
path = "src/bin/silicon-omni.rs"

[[bin]]
name = "so"
path = "src/bin/so.rs"

# Back after 0.5 retired it, because `omni web` is the name of the thing it
# starts. All three are the same client; this one is what a browser pairs with.
[[bin]]
name = "omni"
path = "src/bin/omni.rs"

[dependencies]
silicon-omni.workspace = true
omni-web.workspace = true
serde_json.workspace = true
